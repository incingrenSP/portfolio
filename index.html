<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samir Pokharel | Portfolio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-left">
                <span class="logo">SP</span>
                <span class="tag">// PORTFOLIO v1.0</span>
            </div>
            <div class="top-center" id="datetime">
                <span class="time" id="clock">00:00:00</span>
                <span class="date" id="dateText"></span>
            </div>
            <div class="top-right">
                <button class="icon-btn" id="mailBtn" title="Copy email" aria-label="Copy email">
                    <svg class="ico" viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M3 6l9 7 9-7"/></svg>
                </button>
                <button class="icon-btn" id="fsBtn" title="Fullscreen" aria-label="Toggle fullscreen">
                    <svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                </button>
                <button class="close-btn" id="resetBtn" title="Back to home" aria-label="Back to home"><span class="x-mark">×</span></button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <nav class="left-sidebar">
                <button class="nav-button" data-section="about">
                    <span class="num">01</span>
                    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                    <span class="lbl">About Me<small>Profile / Bio</small></span>
                </button>
                <button class="nav-button" data-section="projects">
                    <span class="num">02</span>
                    <svg class="ico" viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>
                    <span class="lbl">Projects<small>Selected work</small></span>
                </button>
                <button class="nav-button" data-section="certifications">
                    <span class="num">03</span>
                    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8 14l-2 8 6-3 6 3-2-8"/></svg>
                    <span class="lbl">Certifications<small>Credentials</small></span>
                </button>
                <button class="nav-button" data-section="contact">
                    <span class="num">04</span>
                    <svg class="ico" viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M3 6l9 7 9-7"/></svg>
                    <span class="lbl">Contact Me<small>Get in touch</small></span>
                </button>
                <button class="nav-button" data-section="cv">
                    <span class="num">05</span>
                    <svg class="ico" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>
                    <span class="lbl">CV<small>Open PDF</small></span>
                </button>
            </nav>

            <!-- Center Hub -->
            <section class="center-hub">
                <div class="hub-bg-text" data-depth="-24">PORTFOLIO</div>
                <div class="hub-glow" data-depth="16"></div>
                <div class="hub-content">
                    <div id="centerImage" class="center-image">
                        <img id="hubImg" src="assets/images/profile/profile.jpg" alt="Profile">
                    </div>
                    <div id="projectCarousel" class="project-carousel hidden">
                        <div class="carousel-container"></div>
                    </div>
                </div>
            </section>

            <!-- Right Sidebar -->
            <aside class="right-sidebar" id="rightContent">
                <div class="content-panel">
                    <div class="eyebrow" id="panelTag">// 00 — HOME</div>
                    <h2 id="panelTitle">Welcome</h2>
                    <div id="panelContent" class="panel-content"></div>
                </div>
            </aside>
        </main>

        <!-- Bottom Bar -->
        <footer class="bottom-bar">
            <div class="bottom-left">
                <button class="power-btn" id="powerBtn" aria-label="Power off"><div class="power-icon"></div></button>
                <div class="status-text" id="statusText">Welcome</div>
            </div>
            <div class="bottom-center"><div class="brand-text">SAMIR POKHAREL</div></div>
            <div class="bottom-right"><div class="portfolio-label">PORTFOLIO</div></div>
        </footer>

        <div id="notification" class="notification" role="status"><span id="notificationText"></span></div>
    </div>

    <div id="offline" class="offline hidden">
        <div>SYSTEM OFFLINE</div>
        <button id="rebootBtn">REBOOT</button>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
